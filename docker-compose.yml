version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: balancevault
      POSTGRES_PASSWORD: balancevault_dev_password
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancevault -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balancevault-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BALANCEVAULT_ENVIRONMENT: production
      BALANCEVAULT_DATABASE_URL: postgresql+psycopg://balancevault:balancevault_dev_password@postgres:5432/balancevault
      BALANCEVAULT_REDIS_URL: redis://redis:6379/0
      BALANCEVAULT_JWT_SECRET: production-grade-secret-key-at-least-32-chars-long-here
      BALANCEVAULT_ADMIN_EMAIL: admin@balancevault.local
      BALANCEVAULT_ADMIN_PASSWORD: ProductionAdminPassword2026!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

