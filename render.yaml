services:
  - type: web
    name: balancevault-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install . && alembic upgrade head && python -m balancevault.bootstrap
    startCommand: uvicorn balancevault.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BALANCEVAULT_ENVIRONMENT
        value: production
      - key: BALANCEVAULT_DATABASE_URL
        sync: false
      - key: BALANCEVAULT_JWT_SECRET
        generateValue: true
      - key: BALANCEVAULT_REDIS_URL
        fromRedis:
          name: balancevault-redis
          property: connectionString
      - key: BALANCEVAULT_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: BALANCEVAULT_ADMIN_EMAIL
        value: admin@gmail.com
      - key: BALANCEVAULT_ADMIN_PASSWORD
        sync: false

  - type: redis
    name: balancevault-redis
    plan: free
    ipAllowList: []

